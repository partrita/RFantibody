[project]
name = "rfantibody"
version = "1.0.0"
description = ""
authors = [
  { name = "Nate Bennett", email = "nrbennett2@gmail.com" },
  { name = "Joe Watchwell", email = "joe.watchwell@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.4.0",
    "torchaudio==2.4.0",
    "torchvision==0.19.0",
    "torch-utils==0.1.2",
    "numpy==1.26.4",
    "cuda-python==11.8.0",
    "hydra-core==1.3.2",
    "icecream==2.1.4",
    "opt-einsum==3.4.0",
    "e3nn==0.5.6",
    "pyrsistent==0.20.0",
    "biotite==1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.2",
    "pandas>=2.2.3",
]

[project.scripts]
rfantibody = "rfantibody:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/rfantibody",
    "include",
    "include/SE3Transformer"
]

[tool.ruff.lint]
ignore = ["F821", "E741", "F401", "F405", "F403", "F841", "E731"] 