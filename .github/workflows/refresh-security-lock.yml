name: refresh security lock
on:
  push:
    branches:
      - security/lockfile-remediation
    paths:
      - pyproject.toml
      - .github/workflows/refresh-security-lock.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install Poetry
        run: pip install poetry==2.4.1
      - name: Regenerate lockfile
        run: poetry lock
      - name: Commit lockfile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add poetry.lock
          git diff --cached --quiet || git commit -m "chore(security): regenerate poetry lockfile"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/refresh-security-lock.yml
          git commit -m "chore: remove temporary lock refresh workflow"
          git push
