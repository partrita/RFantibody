name: temporary security lock refresh
on:
  push:
    branches:
      - security/dependabot-python-2026-08
    paths:
      - pyproject.toml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install Poetry
        run: pip install poetry==2.4.1
      - name: Regenerate lockfile
        run: poetry lock
      - name: Commit lockfile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add poetry.lock
          git commit -m "chore(security): refresh poetry lockfile"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/tmp-security-lock-refresh.yml
          git commit -m "chore: remove temporary security lock workflow"
          git push
